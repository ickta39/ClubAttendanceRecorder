<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">

    <style>
        form {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
    </style>
</head>
<body>
    <header>
        <h1><span id="clubname">部活動</span> 出席システム</h1>
    </header>
    <main>
        <div class="container">
            <h2>ログイン</h2>
            <p>ログインして出席を記録してください。</p>

            <form id="login-form">
                <div id="wrong-error" class="warning" style="display: none;">
                    <p><strong>エラー：メールアドレスもしくはパスワードが間違っています。</strong></p>
                </div>
                <input name="host" type="url" placeholder="ホストサーバー" required>
                <input name="email" type="email" placeholder="メールアドレス" required>
                <input name="password" type="password" placeholder="パスワード" required>

                <input type="submit" value="ログイン" class="button">
            </form>
        </div>
    </main>
    <footer>
        <p>Copyright (C) 2026 Ichikawa Technical High School</p>
    </footer>

    <script>
        const LOGIN_FORM = document.getElementById("login-form")
        const WRONG_ERROR = document.getElementById("wrong-error")

        function getCookie(key) {
            var cookies = document.cookie.split(";")
            var value = cookies.find(element => element.trim().startsWith(key + "=")).trim()
        
            return value ? value.substring(key.length + 1, value.length) : null
        }

        addEventListener("DOMContentLoaded", (e) => {
            LOGIN_FORM.host.value = getCookie("host-server")
        })

        LOGIN_FORM.addEventListener("submit", async (e) => {
            e.preventDefault()
            document.cookie = `host-server=${event.target.host.value}; max-age=${30*24*3600}`

            try {
                var token = await login(e.target.email.value, e.target.password.value)

                if (token === null) {
                    WRONG_ERROR.style.display = "unset"
                    return
                }

                document.cookie = `token=${token}; max-age=${30*24*3600}`

                location.href="./index.html"
            }
            catch {
                alert("エラーが発生しました。")
            }
        })

        async function login(email, password) {
            var URL = `${localStorage.getItem("host-server")}/auth/login`
            var resp = await fetch(URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            })

            if (!resp.ok) {
                return null
            }

            return (await resp.json()).token
        }
    </script>
</body>
</html>

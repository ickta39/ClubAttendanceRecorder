<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">

    <style>
        form {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        #list {
            list-style: none;
            height: 6rem;
            overflow-y: auto;
            text-align: left;
        }
    </style>
</head>
<body>
    <header>
        <h1><span id="clubname">部活動</span> 出席システム</h1>
        <div>
            <a href="./login.html" id="login-button">
                <button class="button">ログイン</button>
            </a>

            <div id="profile" style="display: none;">
                <p><span id="profile-name">USER</span> さん</p>
                <button id="logout-button">ログアウト</button>
            </div>
        </div>
    </header>
    <main>
        <div class="container">
            <h2>出席確認</h2>

            <a href="attendance.html">出席を登録</a>

            <div class="container">
                <form id="checker">
                    <input type="date" name="date">
                    <input type="submit" value="検索">
                </form>
                <hr>
                <ul id="list">

                </ul>
            </div>
        </div>
    </main>
    <footer>
        <p>Copyright (C) 2026 Ichikawa Technical High School</p>
    </footer>

    <script>
        const CHECKER_FORM = document.getElementById("checker")

        addEventListener("DOMContentLoaded", (e) => {
            CHECKER_FORM.date.value = new Date().toLocaleDateString("sv-SE")
        })

        CHECKER_FORM.addEventListener("submit", (e) => {
            e.preventDefault()
        })
    </script>
</body>
</html>
